packages:
  - 'gridmix'
  - 'playground'
  - 'packages/*'
  - 'projects/*'
allowBuilds:
  core-js: false
  es5-ext: false
  esbuild: true
  fsevents: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
# Security-hardening overrides: force vulnerable transitive deps up to a patched floor.
# The `pkg@<floor` selector means the override only fires when the resolved version is
# below the floor, so it self-disarms once a parent dep eventually moves past it.
# Bumps are kept within the same major (or across majors where the parent's usage is
# trivially compatible) so the parent never sees an API it doesn't expect. Verified
# with `pnpm test:unit` and `pnpm test:e2e` — see git history for the audit pass.
overrides:
  # CVE-2025-58754 et al. — many SSRF/proto-pollution issues. Parents: source-* packages
  # (now on ^0.31.1 directly) and datocms-client>contentful-management (still on 0.21.x,
  # this override catches it). Same 0.x line — API surface (.create/.get/.post) stable.
  axios@<0.31.1: ^0.31.1
  # GHSA-fjxv-7rqg-78g4 (critical) — unsafe random boundary. Parents: dead `request@2.88`
  # via probe-image-size, airtable, datocms-client. Same major (2.x), patch-only changes.
  form-data@<2.5.4: ^2.5.4
  # GHSA-6rw7-vpxm-498p — arrayLimit DoS. Same parents as form-data. Within v6 line,
  # which has been API-stable for years.
  qs@<6.14.1: ^6.14.1
  # GHSA-x565-32qp-m3vf — sensitive headers leak after redirect. Parent: jimp/@jimp/core
  # (potrace chain). jimp only uses phin's basic HTTP-GET surface, stable across v2→v3.
  phin@<3.7.1: ^3.7.1
  # GHSA-rp65-9cf3-cjxr — ReDoS. Parent: ancient `oust@1>cheerio>css-select`
  # (plugin-critical chain). v1 and v2 both export the same default selector function.
  nth-check@<2.0.1: ^2.0.1
  # GHSA-35jh-r3h4-6jhm, GHSA-29mw-wpgm-hmr9, etc. — command injection / ReDoS / proto
  # pollution. Parent: airtable@^0.7 pins lodash@4.17.15. Same 4.17.x line, patches only.
  # Does NOT cover `lodash.pick@4.4.0` (separate package, no patched version published).
  lodash@<4.17.24: ^4.17.24
  # GHSA-w5p7-h5w8-2hfq — ReDoS. Parent: old remark-parse@6 (transformer-remark) and
  # mdast-util-to-hast@4 (vue-remark). `trim` is a single-function package, API trivial.
  trim@<0.0.3: ^0.0.3
  # GHSA-52f5-9888-hmc6 + GHSA-ph9p-34f9-6g65 — symlink + path traversal. Parents:
  # inquirer@7>external-editor (cli) and datocms-client. `fileSync()` API stable across
  # the 0.0.33 → 0.2.6 jump.
  tmp@<0.2.6: ^0.2.6
  # Deferred to dedicated renewal steps (see project_gridmix_stale_deps memory):
  #   - tough-cookie, uuid (request chain — majors would break request's API expectations)
  #   - braces, micromatch (chokidar@2 in source-filesystem — separate dep bump)
  #   - serialize-javascript (vue-server-renderer chain — Vue 2 ecosystem locked)
  #   - postcss (vue-loader>@vue/component-compiler-utils — Vue 2 ecosystem locked)
  #   - webpack-dev-server v4 → v5 (config-breaking major)
  #   - esbuild (deep webpack/terser chain)
  #   - got, update-notifier (ESM-only in newer versions; cli is CJS)
  #   - parse-link-header (ancient datocms-client>wpapi)
  #   - vue@2.7.16 (Vue 2 EOL, low-severity ReDoS)

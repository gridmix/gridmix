name: Lint

on:
  push:
    branches:
      - main
    paths:
      - '**.js'
      - '.github/workflows/lint.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**.js'
      - '.github/workflows/lint.yml'

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run linter
        run: pnpm lint

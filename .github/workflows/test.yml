name: Test

on:
  push:
    branches:
      - main
    paths:
      - 'pnpm-lock.yaml'
      - 'jest.config.js'
      - 'gridmix/**/*.js'
      - 'packages/**/*.js'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'pnpm-lock.yaml'
      - 'jest.config.js'
      - 'gridmix/**/*.js'
      - 'packages/**/*.js'
      - '.github/workflows/test.yml'

jobs:
  test:
    name: Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        # `shell: bash` resolves to Git Bash on Windows runners, so the
        # POSIX-style env-var prefix in the test:unit script works on all OSes.
        shell: bash
        run: pnpm test:unit --ci
